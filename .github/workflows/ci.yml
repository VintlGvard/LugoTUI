name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        go: [minimum, stable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - if: matrix.go == 'minimum'
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - if: matrix.go == 'stable'
        uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
      - name: Pure Go build and tests
        env:
          CGO_ENABLED: '0'
          GOTOOLCHAIN: local
        run: |
          go build ./...
          go test ./...
          go vet ./...
      - name: Race tests (separate CGO build)
        env:
          CGO_ENABLED: '1'
          GOTOOLCHAIN: local
        run: go test -race ./...
      - if: matrix.go == 'stable'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: go run ./cmd/lugotui --check
      - run: go run ./cmd/lugotui --app internal/assets/demo.lua --check

  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
      - name: Native race and platform regressions
        env:
          CGO_ENABLED: '1'
        run: go test -race ./...
      - run: go vet ./...
      - run: go run ./cmd/lugotui --check
      - run: go run ./cmd/lugotui --app internal/assets/demo.lua --check

  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
      - name: Validate all six release targets without publishing
        run: python3 .github/scripts/release.py --local --version dev --output "$RUNNER_TEMP/release-check"
