name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go vet ./...
      - run: go run ./cmd/lugotui --check
      - run: go run ./cmd/lugotui --app internal/assets/demo.lua --check
      - if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
